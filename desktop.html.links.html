<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
</head>

<body>

    <h1>Useful Links</h1>

    <!-- Fragment Target -->
    <h2 id="contact">Contact Information</h2>
    <p>You can contact me using the links below.</p>

    <!-- Absolute Link -->
    <p>
        <a href="https://www.google.com" target="_blank" rel="noopener noreferrer">
            Visit Google
        </a>
    </p>

    <!-- Relative Link -->
    <p>
        <a href="about-me.html">
            Go to About Me Page
        </a>
    </p>

    <!-- Fragment Link -->
    <p>
        <a href="#contact">
            Jump to Contact Section
        </a>
    </p>

    <!-- Mail Link -->
    <p>
        <a href="mailto:firas@example.com">
            Send me an Email
        </a>
    </p>

    <!-- Phone Link -->
    <p>
        <a href="tel:+963999999999">
            Call Me
        </a>
    </p>

</body>

</html>
