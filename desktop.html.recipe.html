<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chocolate Cake Recipe</title>
</head>

<body>

    <h1>Chocolate Cake Recipe</h1>

    <h2>Ingredients</h2>

    <ul>
        <li>2 cups flour</li>
        <li>1 cup sugar</li>
        <li>2 eggs</li>
        <li>1 cup milk</li>
        <li>
            Chocolate
            <ul>
                <li>Dark chocolate</li>
                <li>Cocoa powder</li>
            </ul>
        </li>
    </ul>

    <h2>Steps</h2>

    <ol>
        <li>Mix all dry ingredients.</li>
        <li>Add eggs and milk.</li>
        <li>Bake for 35 minutes.</li>
        <li>Let it cool before serving.</li>
    </ol>

</body>

</html>
