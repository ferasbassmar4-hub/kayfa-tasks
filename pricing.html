<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing</title>
</head>

<body>

    <h1>Pricing Plans</h1>

    <table border="1">

        <caption>Website Plans</caption>

        <thead>
            <tr>
                <th colspan="3">Pricing Table</th>
            </tr>

            <tr>
                <th scope="col">Plan</th>
                <th scope="col">Storage</th>
                <th scope="col">Price</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>Basic</td>
                <td>10 GB</td>
                <td>$5</td>
            </tr>

            <tr>
                <td>Standard</td>
                <td>50 GB</td>
                <td>$10</td>
            </tr>

            <tr>
                <td>Premium</td>
                <td>100 GB</td>
                <td>$20</td>
            </tr>

        </tbody>

    </table>

</body>

</html>
