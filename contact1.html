<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>

<body>

    <h1>Contact Form</h1>

    <form method="GET" action="">

        <label for="name">Name</label>
        <input
            type="text"
            id="name"
            name="name">

        <br><br>

        <button type="submit">
            Send
        </button>

    </form>

    <!--
    With GET method, after submitting,
    the URL will look like:
    ?name=Firas
    -->

</body>

</html>
